services:

  postgres:
    image: postgres:15
    container_name: bitlabs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bitlabs
      POSTGRES_PASSWORD: bitlabs123
      POSTGRES_DB: bitlabs_coding_lab
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitlabs -d bitlabs_coding_lab"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: rahul720/bitlabs-coding-lab-backend:latest
    container_name: bitlabs_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://bitlabs:bitlabs123@postgres:5432/bitlabs_coding_lab
      SECRET_KEY: ${SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-configured}
      EXECUTION_TIMEOUT: 10
      MAX_CONCURRENT_EXECUTIONS: 10
      ALLOWED_ORIGINS: http://localhost
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    image: rahul720/bitlabs-coding-lab-frontend:latest
    container_name: bitlabs_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
